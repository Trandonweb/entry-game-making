name: Build Entry Project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "outputs/우노카드_체스.ent"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re

          p = Path("make_ent.py")
          s = p.read_text(encoding="utf-8")
          readable = {
              "bc_col":"보드 현재 열", "bc_row":"보드 현재 행",
              "dc_i":"덱 색상 순번", "dv_i":"덱 카드 순번", "dw_i":"와일드 카드 순번",
              "di":"셔플 위치 1", "dj":"셔플 위치 2", "dt1":"임시 카드 색", "dt2":"임시 카드 값",
              "cardC":"현재 카드 색", "cardV":"현재 카드 값", "phase":"게임 단계",
              "flip":"보드 회전 상태", "skip":"턴 건너뛰기", "win":"승리 상태",
              "moves":"남은 이동 횟수", "turn":"현재 플레이어",
              "sel_c":"선택한 열", "sel_r":"선택한 행", "selColor":"선택한 말 색",
              "selType":"선택한 말 종류", "selCol":"선택한 말 열", "selRow":"선택한 행",
              "pcol":"말 현재 열", "prow":"말 현재 행", "pk":"말 보드 위치",
              "pcc":"말 색", "pty":"말 종류", "hit":"잡힌 말 여부",
              "hi":"힌트 순번", "hc":"힌트 열", "hr":"힌트 행",
              "bi":"선택창 순번", "bty":"선택 종류", "by":"선택창 Y좌표", "pick":"선택한 종류",
              "sc":"판정 시작 열", "sr":"판정 시작 행", "qk":"판정 보드 위치",
              "mc":"이동할 말 색", "mt":"이동할 말 종류", "tc":"검사 중 열", "tr":"검사 중 행",
              "rk":"검사 보드 위치", "qc":"목표 열", "qr":"목표 행",
              "mk":"출발 보드 위치", "mk2":"도착 보드 위치"
          }
          marker = "READABLE_VAR_NAMES = "
          start = s.find(marker)
          if start >= 0:
              end = s.find("\ndef VAR(n):", start)
              if end < 0:
                  raise SystemExit("VAR function boundary not found")
              s = s[:start] + marker + repr(readable) + s[end:]
          else:
              needle = "def VAR(n):\n"
              if needle not in s:
                  raise SystemExit("VAR function not found")
              s = s.replace(needle, marker + repr(readable) + "\n" + needle, 1)
          old = 'VARS[n] = {"id": nid(), "name": n, "shown": False, "x": 0, "y": 0, "obj": None}'
          new = 'VARS[n] = {"id": nid(), "name": READABLE_VAR_NAMES.get(n, n), "shown": False, "x": 0, "y": 0, "obj": None}'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("VAR variable record target not found")

          # Entry change_value_list_index parameter order is:
          # [list, index, value, None].  The old generator put value first,
          # which is exactly what caused "대상 없음" in the deck object.
          old_ls = 'def LS(l,i,x): return blk("change_value_list_index",[a(x),LID(l),a(i),None])'
          new_ls = 'def LS(l,i,x): return blk("change_value_list_index",[LID(l),a(i),a(x),None])'
          if old_ls in s:
              s = s.replace(old_ls, new_ls, 1)
          elif new_ls not in s:
              raise SystemExit("LS helper target not found")

          # Rebuild the UNO deck with compact loops.
          build_start = s.find('SC["덱"] += [[\n    WHEN("build_deck"),')
          recycle_start = s.find('SC["덱"] += [[\n    WHEN("recycle"),', build_start)
          if build_start < 0 or recycle_start < 0:
              raise SystemExit("UNO build/recycle section not found")
          build_block = '''SC["덱"] += [[
    WHEN("build_deck"),
    CLEAR("deckC"), CLEAR("deckV"),
    S("dc_i",1),
    REP(4,
        S("dv_i",1),
        REP(25,
            LA("deckC",item("uno_colors",V("dc_i"))),
            LA("deckV",item("uno_values",V("dv_i"))),
            C("dv_i",1)),
        C("dc_i",1)),
    REP(4,
        LA("deckC","검정"),
        LA("deckV","색바꾸기"))
]]

'''
          s = s[:build_start] + build_block + s[recycle_start:]

          shuffle_start = s.find('SC["덱"] += [[\n    WHEN("shuffle"),')
          recycle_start = s.find('SC["덱"] += [[\n    WHEN("recycle"),', shuffle_start)
          if shuffle_start < 0 or recycle_start < 0:
              raise SystemExit("UNO shuffle/recycle section not found")
          shuffle_block = '''SC["덱"] += [[
    WHEN("shuffle"),
    IF(gt(ln("deckC"),1),
       REP(400,
           S("di",rand(1,ln("deckC"))),
           S("dj",rand(1,ln("deckC"))),
           S("dt1",item("deckC",V("di"))),
           S("dt2",item("deckV",V("di"))),
           LS("deckC",V("di"),item("deckC",V("dj"))),
           LS("deckV",V("di"),item("deckV",V("dj"))),
           LS("deckC",V("dj"),V("dt1")),
           LS("deckV",V("dj"),V("dt2"))),
       [])
]]

'''
          s = s[:shuffle_start] + shuffle_block + s[recycle_start:]

          # Avoid shadowing the item() helper in packaging code if such a loop exists.
          s = s.replace('for item in PICS[n]:', 'for pic in PICS[n]:')
          s = s.replace('for item in PICS[o]:', 'for pic in PICS[o]:')
          s = s.replace('for item in pics:', 'for pic in pics:')

          s = s.replace('tarfile.open(out,"w:gz")', 'tarfile.open(out,"w:gz",compresslevel=6)')
          for old_name in ("우노카드 + 체스 v0.1.6", "우노카드 + 체스 v0.1.7"):
              s = s.replace('"name":"' + old_name + '"', '"name":"우노카드 + 체스 v0.1.8"')
          ast.parse(s)
          p.write_text(s, encoding="utf-8")
          PY
          python -m py_compile make_ent.py
      - name: Build .ent
        run: python make_ent.py
      - name: Validate generated ENT project JSON
        run: |
          python - <<'PY'
          import json, tarfile
          from pathlib import Path
          ent = Path("outputs/우노카드_체스.ent")
          if not ent.exists() or ent.stat().st_size == 0:
              raise SystemExit("ENT file was not created")
          with tarfile.open(ent, "r:gz") as t:
              member = t.getmember("temp/project.json")
              data = json.loads(t.extractfile(member).read().decode("utf-8"))
          required = ["objects", "variables", "messages", "functions", "scenes", "interface"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"project.json missing keys: {missing}")
          var_ids = {v["id"] for v in data["variables"] if isinstance(v, dict) and "id" in v}
          msg_ids = {m["id"] for m in data["messages"] if isinstance(m, dict) and "id" in m}
          block_count = 0
          def walk(value):
              global block_count
              if isinstance(value, dict):
                  if "type" in value:
                      block_count += 1
                      if not isinstance(value.get("params", []), list):
                          raise SystemExit(f"invalid params in block {value.get('id')}")
                      if not isinstance(value.get("statements", []), list):
                          raise SystemExit(f"invalid statements in block {value.get('id')}")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          for obj in data["objects"]:
              if not isinstance(obj.get("script"), str):
                  raise SystemExit(f"object script is not JSON text: {obj.get('name')}")
              walk(json.loads(obj["script"]))
          if not data["objects"] or block_count == 0:
              raise SystemExit("no objects or blocks found")
          names = [v.get("name") for v in data["variables"] if isinstance(v, dict)]
          if any(x in names for x in ("di", "dj", "dc_i", "dv_i", "bc_col", "bc_row")):
              raise SystemExit("internal variable names were not renamed")
          print(f"ENT validation OK: {ent.stat().st_size} bytes, objects={len(data['objects'])}, blocks={block_count}")
          print(f"variables={len(var_ids)}, messages={len(msg_ids)}")
          PY
      - name: Publish .ent and repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add make_ent.py "outputs/우노카드_체스.ent"
          git commit -m "Fix Entry list parameter order and UNO deck" || echo "No changes to commit"
          git push
      - name: Upload .ent artifact
        uses: actions/upload-artifact@v4
        with:
          name: 우노카드-체스
          path: outputs/우노카드_체스.ent
          if-no-files-found: error
