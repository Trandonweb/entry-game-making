name: Build Entry Project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "outputs/우노카드_체스.ent"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare generator
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import re
          import random

          p = Path("make_ent.py")
          s = p.read_text(encoding="utf-8")
          readable = {
              "bc_col":"보드 현재 열", "bc_row":"보드 현재 행",
              "dc_i":"덱 색상 순번", "dv_i":"덱 카드 순번", "dw_i":"와일드 카드 순번",
              "di":"셔플 위치 1", "dj":"셔플 위치 2", "dt1":"임시 카드 색", "dt2":"임시 카드 값",
              "cardC":"현재 카드 색", "cardV":"현재 카드 값", "phase":"게임 단계",
              "flip":"보드 회전 상태", "skip":"턴 건너뛰기", "win":"승리 상태",
              "moves":"남은 이동 횟수", "turn":"현재 플레이어",
              "sel_c":"선택한 열", "sel_r":"선택한 행", "selColor":"선택한 말 색",
              "selType":"선택한 말 종류", "selCol":"선택한 말 열", "selRow":"선택한 행",
              "pcol":"말 현재 열", "prow":"말 현재 행", "pk":"말 보드 위치",
              "pcc":"말 색", "pty":"말 종류", "hit":"잡힌 말 여부",
              "hi":"힌트 순번", "hc":"힌트 열", "hr":"힌트 행",
              "bi":"선택창 순번", "bty":"선택 종류", "by":"선택창 Y좌표", "pick":"선택한 종류",
              "sc":"판정 시작 열", "sr":"판정 시작 행", "qk":"판정 보드 위치",
              "mc":"이동할 말 색", "mt":"이동할 말 종류", "tc":"검사 중 열", "tr":"검사 중 행",
              "rk":"검사 보드 위치", "qc":"목표 열", "qr":"목표 행",
              "mk":"출발 보드 위치", "mk2":"도착 보드 위치"
          }
          marker = "READABLE_VAR_NAMES = "
          start = s.find(marker)
          if start >= 0:
              end = s.find("\ndef VAR(n):", start)
              if end < 0:
                  raise SystemExit("VAR function boundary not found")
              s = s[:start] + marker + repr(readable) + s[end:]
          else:
              needle = "def VAR(n):\n"
              if needle not in s:
                  raise SystemExit("VAR function not found")
              s = s.replace(needle, marker + repr(readable) + "\n" + needle, 1)
          old = 'VARS[n] = {"id": nid(), "name": n, "shown": False, "x": 0, "y": 0, "obj": None}'
          new = 'VARS[n] = {"id": nid(), "name": READABLE_VAR_NAMES.get(n, n), "shown": False, "x": 0, "y": 0, "obj": None}'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("VAR variable record target not found")

          # Entry list block parameter order:
          # value_of_index_from_list = [None, list, None, index, None]
          # change_value_list_index = [list, index, value, None]
          if 'def item_literal(l,i):' not in s:
              needle = 'def item(l,i): return blk("value_of_index_from_list",[None,LID(l),None,a(i),None])\n'
              if needle not in s:
                  raise SystemExit("item helper not found")
              replacement = needle + 'def item_literal(l,i): return blk("value_of_index_from_list",[None,LID(l),None,a(i),None])\n' + 'def LS_literal(l,i,x): return blk("change_value_list_index",[LID(l),a(i),a(x),None])\n'
              s = s.replace(needle, replacement, 1)
          else:
              s = s.replace('def item_literal(l,i): return blk("value_of_index_from_list",[None,LID(l),None,str(i),None])', 'def item_literal(l,i): return blk("value_of_index_from_list",[None,LID(l),None,a(i),None])')
              s = s.replace('def LS_literal(l,i,x): return blk("change_value_list_index",[a(x),LID(l),str(i),None])', 'def LS_literal(l,i,x): return blk("change_value_list_index",[LID(l),a(i),a(x),None])')

          # Replace runtime-indexed deck construction with explicit entries.
          colors = ["빨강","노랑","초록","파랑"]
          values = ["0"] + [str(i) for i in range(1,10)] * 2 + ["+2","+2","금지","금지","순서바꾸기","순서바꾸기"]
          build_lines = [
              'SC["덱"] += [[',
              '    WHEN("build_deck"),',
              '    CLEAR("deckC"), CLEAR("deckV"),'
          ]
          for color in colors:
              for value in values:
                  build_lines.append(f'    LA("deckC",{color!r}), LA("deckV",{value!r}),')
          for _ in range(4):
              build_lines.append('    LA("deckC","검정"), LA("deckV","색바꾸기"),')
          build_lines[-1] = build_lines[-1].rstrip(',')
          build_lines.append(']]')
          build_block = "\n".join(build_lines)

          build_pattern = re.compile(r'SC\["덱"\] \+= \[\[\n    WHEN\("build_deck"\),.*?\n\]\]\n\nSC\["덱"\] \+= \[\[\n    WHEN\("shuffle"\),', re.S)
          if not build_pattern.search(s):
              raise SystemExit("build_deck/shuffle boundary not found")
          s = build_pattern.sub(build_block + '\n\nSC["덱"] += [[\n    WHEN("shuffle"),', s, count=1)

          # Keep the compact deterministic shuffle, but make every list parameter valid.
          rng = random.Random(2024)
          swap_lines = [
              'SC["덱"] += [[',
              '    WHEN("shuffle"),',
              '    IF(gt(ln("deckC"),1),',
              '       ['
          ]
          for _ in range(300):
              i = rng.randint(1, 104)
              j = rng.randint(1, 104)
              swap_lines += [
                  f'           S("dt1",item_literal("deckC",{i})),',
                  f'           S("dt2",item_literal("deckV",{i})),',
                  f'           LS_literal("deckC",{i},item_literal("deckC",{j})),',
                  f'           LS_literal("deckV",{i},item_literal("deckV",{j})),',
                  f'           LS_literal("deckC",{j},V("dt1")),',
                  f'           LS_literal("deckV",{j},V("dt2")),',
              ]
          body = []
          for k in range(0, len(swap_lines) - 4, 6):
              body.extend(swap_lines[4+k:10+k])
          swap_lines = swap_lines[:4] + [f'           {x.strip()}' for x in body] + [
              '       ],',
              '       [])',
              ']]'
          ]
          shuffle_block = "\n".join(swap_lines)

          shuffle_pattern = re.compile(r'SC\["덱"\] \+= \[\[\n    WHEN\("shuffle"\),.*?\n\]\]\n\nSC\["덱"\] \+= \[\[\n    WHEN\("recycle"\),', re.S)
          if not shuffle_pattern.search(s):
              raise SystemExit("shuffle/recycle boundary not found")
          s = shuffle_pattern.sub(shuffle_block + '\n\nSC["덱"] += [[\n    WHEN("recycle"),', s, count=1)

          s = s.replace('tarfile.open(out,"w:gz")', 'tarfile.open(out,"w:gz",compresslevel=6)')
          for old_name in ("우노카드 + 체스 v0.1.6", "우노카드 + 체스 v0.1.7"):
              s = s.replace('"name":"' + old_name + '"', '"name":"우노카드 + 체스 v0.1.8"')
          ast.parse(s)
          p.write_text(s, encoding="utf-8")
          PY
          python -m py_compile make_ent.py
      - name: Build .ent
        run: python make_ent.py
      - name: Validate generated ENT project JSON
        run: |
          python - <<'PY'
          import json, tarfile
          from pathlib import Path
          ent = Path("outputs/우노카드_체스.ent")
          if not ent.exists() or ent.stat().st_size == 0:
              raise SystemExit("ENT file was not created")
          with tarfile.open(ent, "r:gz") as t:
              member = t.getmember("temp/project.json")
              data = json.loads(t.extractfile(member).read().decode("utf-8"))
          required = ["objects", "variables", "messages", "functions", "scenes", "interface"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"project.json missing keys: {missing}")
          var_ids = {v["id"] for v in data["variables"] if isinstance(v, dict) and "id" in v}
          msg_ids = {m["id"] for m in data["messages"] if isinstance(m, dict) and "id" in m}
          block_count = 0
          def walk(value):
              global block_count
              if isinstance(value, dict):
                  if "type" in value:
                      block_count += 1
                      if not isinstance(value.get("params", []), list):
                          raise SystemExit(f"invalid params in block {value.get('id')}")
                      if not isinstance(value.get("statements", []), list):
                          raise SystemExit(f"invalid statements in block {value.get('id')}")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          for obj in data["objects"]:
              if not isinstance(obj.get("script"), str):
                  raise SystemExit(f"object script is not JSON text: {obj.get('name')}")
              walk(json.loads(obj["script"]))
          if not data["objects"] or block_count == 0:
              raise SystemExit("no objects or blocks found")
          names = [v.get("name") for v in data["variables"] if isinstance(v, dict)]
          if any(x in names for x in ("di", "dj", "dc_i", "dv_i", "bc_col", "bc_row")):
              raise SystemExit("internal variable names were not renamed")
          print(f"ENT validation OK: {ent.stat().st_size} bytes, objects={len(data['objects'])}, blocks={block_count}")
          print(f"variables={len(var_ids)}, messages={len(msg_ids)}")
          PY
      - name: Publish .ent and repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add make_ent.py "outputs/우노카드_체스.ent"
          git commit -m "Fix Entry list parameter order" || echo "No changes to commit"
          git push
      - name: Upload .ent artifact
        uses: actions/upload-artifact@v4
        with:
          name: 우노카드-체스
          path: outputs/우노카드_체스.ent
          if-no-files-found: error
