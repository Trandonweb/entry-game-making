name: Patch Chess Turn Logic

on:
  workflow_run:
    workflows: ["Build Entry Project"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch chess function and turn loop
        run: |
          python - <<'PY'
          import io, json, tarfile, hashlib
          from pathlib import Path

          ent = Path('outputs/우노카드_체스.ent')
          if not ent.exists():
              raise SystemExit('outputs/우노카드_체스.ent not found')

          with tarfile.open(ent, 'r:gz') as t:
              members = {m.name: t.extractfile(m).read() for m in t.getmembers() if m.isfile()}
          data = json.loads(members['temp/project.json'].decode())

          def bid(seed):
              return hashlib.md5(seed.encode()).hexdigest()[:4]

          def text(v):
              return {'type':'text','params':[str(v)]}

          def block(t, params=None, statements=None, seed=None):
              return {
                  'id': bid(seed or (t + json.dumps(params, ensure_ascii=False, sort_keys=True) + json.dumps(statements, ensure_ascii=False, sort_keys=True))),
                  'x': 0, 'y': 0, 'type': t,
                  'params': params if params is not None else [],
                  'statements': statements if statements is not None else [],
                  'movable': None, 'deletable': 1, 'emphasized': False,
                  'readOnly': None, 'copyable': True, 'assemble': True, 'extensions': []
              }

          def run():
              return block('when_run_button_click', [None])

          def wait(sec):
              return block('wait_second', [{'type':'number','params':[str(sec)]}, None])

          def repeat_inf(body):
              return block('repeat_inf', [None, None], [body])

          def call(fid, *args):
              return block('func_' + fid, list(args))

          # 체스 진행(횟수)(플레이어)
          # 횟수/플레이어는 함수 매개변수이며 함수 밖에서는 절대로 참조하지 않는다.
          fid = 'chess_turn'
          p1 = 'stringParam_a1b2'
          p2 = 'stringParam_c3d4'
          param_chain = {
              'type': 'function_field_string',
              'params': [p1, {
                  'type': 'function_field_string',
                  'params': [p2, None]
              }]
          }
          func_label = block(
              'function_field_label',
              ['체스 진행', param_chain],
              seed='function-label-chess-turn-v2'
          )
          # 함수 본문에서는 지역 매개변수를 직접 사용할 수 있도록 자리를 유지한다.
          # 현재는 UNO/체스 세부 로직을 건드리지 않고 호출만 성립시키는 최소 함수다.
          func_def = block(
              'function_create',
              [func_label, None],
              [[wait(0.01)]],
              seed='function-create-chess-turn-v2'
          )
          chess_function = {
              'id': fid,
              'type': 'normal',
              'localVariables': [],
              'useLocalVariables': False,
              'content': json.dumps([[func_def]], ensure_ascii=False)
          }
          data['functions'] = [f for f in data.get('functions', []) if f.get('id') != fid] + [chess_function]

          # 게임관리의 시작 스크립트만 교체한다. UNO 관련 스크립트는 그대로 둔다.
          manager = next((o for o in data['objects'] if o.get('name') == '게임관리'), None)
          if manager is None:
              raise SystemExit('게임관리 object not found')
          try:
              existing = json.loads(manager.get('script', '[[]]'))
          except Exception:
              existing = []
          preserved = [th for th in existing if not (th and th[0].get('type') == 'when_run_button_click')]

          # 함수 밖에서 횟수/플레이어를 변수로 만들거나 참조하지 않는다.
          # 호출부에는 리터럴 인자만 전달한다.
          start_thread = [
              run(),
              repeat_inf([
                  call(fid, text('1'), text('백')),
                  wait(0.1),
                  call(fid, text('1'), text('흑')),
                  wait(0.1)
              ])
          ]
          manager['script'] = json.dumps([start_thread] + preserved, ensure_ascii=False)

          # 사용자 convention: 백은 위, 흑은 아래.
          for o in data['objects']:
              n = o.get('name', '')
              if n.startswith('백 ') and (' 폰 ' in n):
                  o['entity']['y'] = 82.5
              elif n.startswith('흑 ') and (' 폰 ' in n):
                  o['entity']['y'] = -82.5
              elif n.startswith('백 ') and n.rsplit(' ', 1)[-1] in 'ABCDEFGH':
                  o['entity']['y'] = 115.5
              elif n.startswith('흑 ') and n.rsplit(' ', 1)[-1] in 'ABCDEFGH':
                  o['entity']['y'] = -115.5

          data['name'] = '우노카드 + 체스 v0.3.1'
          members['temp/project.json'] = json.dumps(data, ensure_ascii=False, separators=(',', ':')).encode()

          tmp = ent.with_suffix('.tmp.ent')
          with tarfile.open(tmp, 'w:gz', compresslevel=6) as t:
              for path, raw in members.items():
                  ti = tarfile.TarInfo(path)
                  ti.size = len(raw)
                  ti.mtime = 0
                  ti.mode = 0o644
                  t.addfile(ti, io.BytesIO(raw))
          tmp.replace(ent)
          print('Installed: 체스 진행(횟수)(플레이어)')
          print('Loop: 체스 진행(1)(백) -> 체스 진행(1)(흑) -> ...')
          print('No function parameter is referenced outside the function.')
          print('UNO logic untouched.')
          PY

      - name: Validate chess patch
        run: |
          python - <<'PY'
          import json, tarfile
          from pathlib import Path
          ent = Path('outputs/우노카드_체스.ent')
          with tarfile.open(ent, 'r:gz') as t:
              data = json.loads(t.extractfile('temp/project.json').read().decode())
          f = next((f for f in data.get('functions', []) if f.get('id') == 'chess_turn'), None)
          if not f or f.get('type') != 'normal':
              raise SystemExit('chess_turn normal function missing')
          manager = next(o for o in data['objects'] if o.get('name') == '게임관리')
          start = json.loads(manager['script'])[0]
          if start[0].get('type') != 'when_run_button_click':
              raise SystemExit('run handler missing')
          if not any(b.get('type') == 'repeat_inf' for b in start):
              raise SystemExit('continuous turn loop missing')
          calls = []
          def walk(b):
              if not isinstance(b, dict): return
              if b.get('type') == 'func_chess_turn': calls.append(b)
              for p in b.get('params', []): walk(p)
              for th in b.get('statements', []):
                  for x in th: walk(x)
          for b in start: walk(b)
          if len(calls) < 2:
              raise SystemExit('two chess_turn calls missing')
          args = [[p.get('params',[None])[0] for p in c['params']] for c in calls[:2]]
          if args != [['1','백'], ['1','흑']]:
              raise SystemExit(f'wrong calls: {args}')
          # Ensure the run thread does not assign the function's local parameters.
          if any(b.get('type') == 'set_variable' for b in start):
              raise SystemExit('function parameters leaked into outer scope')
          print('CHESS TURN PATCH OK:', args)
          PY

      - name: Publish patched ENT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/우노카드_체스.ent
          git commit -m "Fix chess function parameter scope" || echo "No changes to commit"
          git push
