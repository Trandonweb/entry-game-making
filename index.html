<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우노카드 + 체스</title>
<style>
body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#111;color:#fff;text-align:center}
main{padding:32px}h1{margin-bottom:8px}p{opacity:.75}
a{display:inline-block;padding:12px 20px;border-radius:10px;background:#2e9e4f;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
<h1>우노카드 + 체스</h1>
<p>ENT 파일을 준비하고 있습니다…</p>
<a id="download" href="outputs/우노카드_체스.ent" download>다운로드</a>
</main>
<script>
const a=document.getElementById("download");
const url="outputs/우노카드_체스.ent";
fetch(url,{method:"HEAD",cache:"no-store"}).then(r=>{
  if(r.ok){
    document.querySelector("p").textContent="ENT 파일 다운로드를 시작합니다.";
    setTimeout(()=>a.click(),150);
  }else{
    document.querySelector("p").textContent="아직 ENT 파일이 생성되지 않았습니다. 잠시 후 다시 접속해 주세요.";
  }
}).catch(()=>{
  document.querySelector("p").textContent="파일을 확인하지 못했습니다. 아래 버튼으로 다시 시도하세요.";
});
</script>
</body>
</html>
